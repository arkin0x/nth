name: Headers-v1 head blob

# Grows the headers-v1 head blob to the newest checkpoint height (a height
# h with h % 1000 == 999, at least 100 blocks deep) with
# scripts/headers_head.py, then either PROPOSES it or PUBLISHES it.
#
# The mode is the repository variable HEADERS_PUBLISH (Settings > Secrets and
# variables > Actions > Variables):
#
#   unset, or anything but "auto"   propose (as before): push a new branch
#                                   auto/headers-head-<height> and open a pull
#                                   request into headers-v1 (or, when Actions
#                                   may not open pull requests here, an issue
#                                   with the one click that does). A person
#                                   merges. Reminders go out on Mondays only.
#   "auto"                          publish: fast-forward headers-v1 itself,
#                                   then close every proposal it supersedes.
#
# Either way the blobs pass the same checks first: the whole published line
# re-verified from genesis, the new headers through the same consensus rules,
# every new checkpoint cross-checked against two other sources, the head
# grown append-only, and the written directory verified again from genesis.
# scripts/headers_publish.sh does every push and holds every git guard: only
# manifest.json and blob files change, finalized blobs never do, no force
# push, and publish only on top of the headers-v1 it verified on.
#
# It never pushes to master and never deploys anything. The NTH publisher
# (kind 321 anchors on the relays) is a different program and is not touched.

on:
  schedule:
    - cron: "23 6 * * *" # daily 06:23 UTC: a checkpoint is published (or proposed) within a day of being 100 blocks deep
  workflow_dispatch: {}

permissions:
  contents: write # push the proposal branch, or fast-forward headers-v1 in auto mode (see headers_publish.sh)
  pull-requests: write # open the proposal, close superseded ones
  issues: write # the reminder or failure issue

concurrency:
  group: headers-head
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  MODE: ${{ vars.HEADERS_PUBLISH == 'auto' && 'auto' || 'propose' }}

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the tool (master)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tool
          persist-credentials: false

      - name: Check out the line (headers-v1)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: headers-v1
          path: line
          persist-credentials: false

      - name: Is a proposal already waiting?
        id: waiting
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "mode: $MODE"
          # A reminder only on Mondays (or a manual run), so a daily schedule
          # reminds weekly.
          remind=false
          if [ "$EVENT" != schedule ] || [ "$(date -u +%u)" = 1 ]; then remind=true; fi
          # In auto mode nothing waits: a proposal still open is superseded
          # by this run's publish, which closes it.
          if [ "$MODE" = auto ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Any open pull request into headers-v1 is a proposal waiting for review.
          pr=$(gh pr list --base headers-v1 --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            if [ "$remind" = true ]; then
              gh pr comment "$pr" --body "Weekly reminder: a pull request into headers-v1 is still open. Review and merge it (or close it) and the next run proposes the newest checkpoint height. Run: $RUN_URL"
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A proposal filed as an issue (no pull request permission) waits the
          # same way, until the line reaches its height.
          top=$(python3 -I -c 'import json; print(int(json.load(open("line/manifest.json"))["generatedAtHeight"]))')
          gh issue list --state open --search 'in:title "headers-v1: head blob to checkpoint"' --json number,title \
            --jq '.[] | select(.title | test("^headers-v1: head blob to checkpoint [0-9]+: open the pull request$")) | "\(.number) \(.title)"' > "$RUNNER_TEMP/issues.txt"
          skip=false
          while read -r number rest; do
            height=$(printf '%s\n' "$rest" | sed -E 's/^headers-v1: head blob to checkpoint ([0-9]+):.*/\1/')
            if [ "$top" -ge "$height" ]; then
              gh issue close "$number" --comment "headers-v1 now reaches block $top, at or past $height, so this proposal has landed. Closed by the job. Run: $RUN_URL"
            else
              if [ "$remind" = true ]; then
                gh issue comment "$number" --body "Weekly reminder: this head-blob proposal is still waiting. Open and merge its pull request (or close this issue) and the next run proposes the newest checkpoint height. Run: $RUN_URL"
              fi
              skip=true
            fi
          done < "$RUNNER_TEMP/issues.txt"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Test the tool
        if: steps.waiting.outputs.skip == 'false'
        timeout-minutes: 10
        env:
          HEADERS_DIR: ${{ github.workspace }}/line
        run: python3 -I -m unittest discover -s tool/test -p 'test_*.py'

      - name: Derive, verify and cross-check
        id: derive
        if: steps.waiting.outputs.skip == 'false'
        # Its own limit, below the job's, so a hang fails this step and the
        # failure issue below still runs.
        timeout-minutes: 40
        run: |
          set +e
          python3 -I tool/scripts/headers_head.py --headers-dir line \
            --summary-json "$RUNNER_TEMP/summary.json" --summary-md "$RUNNER_TEMP/summary.md"
          code=$?
          set -e
          if [ "$code" = 10 ]; then echo "The head is already at the newest checkpoint height."; echo "extended=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$code" = 0 ]
          height=$(python3 -I -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["checkpoint"]["height"]))' "$RUNNER_TEMP/summary.json")
          echo "height=$height" >> "$GITHUB_OUTPUT"
          echo "branch=auto/headers-head-$height" >> "$GITHUB_OUTPUT"
          # A word, not a number: a skipped step's outputs are null, and GitHub
          # compares null with '0' as 0 == 0, which once ran the push step after
          # a skipped derive (run 41401521166). Null never equals 'true'.
          echo "extended=true" >> "$GITHUB_OUTPUT"

      - name: Push the proposal branch
        if: steps.derive.outputs.extended == 'true' && env.MODE != 'auto'
        working-directory: line
        env:
          GH_TOKEN: ${{ github.token }}
          HEIGHT: ${{ steps.derive.outputs.height }}
        run: bash ../tool/scripts/headers_publish.sh propose "$HEIGHT"

      - name: Open the pull request, or the reminder issue
        if: steps.derive.outputs.extended == 'true' && env.MODE != 'auto'
        working-directory: line
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.derive.outputs.branch }}
          HEIGHT: ${{ steps.derive.outputs.height }}
          COMPARE: ${{ github.server_url }}/${{ github.repository }}/compare/headers-v1...
        run: |
          title="headers-v1: head blob to checkpoint $HEIGHT"
          { cat "$RUNNER_TEMP/summary.md"; printf '\nRun: %s\n' "$RUN_URL"; } > "$RUNNER_TEMP/pr.md"
          if gh pr create --base headers-v1 --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr.md" 2> "$RUNNER_TEMP/pr.err"; then
            exit 0
          fi
          cat "$RUNNER_TEMP/pr.err"
          {
            printf 'The job verified and pushed `%s` but could not open the pull request. GitHub said:\n\n```\n' "$BRANCH"
            cat "$RUNNER_TEMP/pr.err"
            printf '```\n\nIf Actions may not create pull requests here (Settings > Actions > General > Workflow permissions), open it here: %s%s?expand=1\n\nThe next run closes this issue once headers-v1 reaches %s.\n\n---\n\n' "$COMPARE" "$BRANCH" "$HEIGHT"
            cat "$RUNNER_TEMP/pr.md"
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$title: open the pull request" --body-file "$RUNNER_TEMP/issue.md"

      - name: Publish to headers-v1
        if: steps.derive.outputs.extended == 'true' && env.MODE == 'auto'
        working-directory: line
        env:
          GH_TOKEN: ${{ github.token }}
          HEIGHT: ${{ steps.derive.outputs.height }}
        run: |
          bash ../tool/scripts/headers_publish.sh publish "$HEIGHT"
          {
            printf 'Published to headers-v1 by the job (HEADERS_PUBLISH=auto). Run: %s\n\n' "$RUN_URL"
            cat "$RUNNER_TEMP/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close the proposals this publish supersedes
        if: steps.derive.outputs.extended == 'true' && env.MODE == 'auto'
        env:
          GH_TOKEN: ${{ github.token }}
          HEIGHT: ${{ steps.derive.outputs.height }}
        run: |
          note="headers-v1 now reaches block $HEIGHT, published by the job (HEADERS_PUBLISH=auto), so this proposal is superseded. Run: $RUN_URL"
          gh pr list --base headers-v1 --state open --json number,title \
            --jq '.[] | select(.title | test("^headers-v1: head blob to checkpoint [0-9]+$")) | "\(.number) \(.title)"' > "$RUNNER_TEMP/prs.txt"
          while read -r number rest; do
            h=${rest##* }
            if [ "$h" -le "$HEIGHT" ]; then gh pr close "$number" --comment "$note"; fi
          done < "$RUNNER_TEMP/prs.txt"
          gh issue list --state open --search 'in:title "headers-v1: head blob to checkpoint"' --json number,title \
            --jq '.[] | select(.title | test("^headers-v1: head blob to checkpoint [0-9]+: open the pull request$")) | "\(.number) \(.title)"' > "$RUNNER_TEMP/issues.txt"
          while read -r number rest; do
            h=$(printf '%s\n' "$rest" | sed -E 's/^headers-v1: head blob to checkpoint ([0-9]+):.*/\1/')
            if [ "$h" -le "$HEIGHT" ]; then gh issue close "$number" --comment "$note"; fi
          done < "$RUNNER_TEMP/issues.txt"

      - name: Report a failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Weekly headers-v1 head blob job failed"
          {
            printf 'The scheduled job published nothing. Run: %s\n\n' "$RUN_URL"
            if [ -f "$RUNNER_TEMP/summary.md" ]; then cat "$RUNNER_TEMP/summary.md"; fi
          } > "$RUNNER_TEMP/fail.md"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/fail.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/fail.md"
          fi
