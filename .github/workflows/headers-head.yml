name: Weekly headers-v1 head blob

# Grows the headers-v1 head blob to the newest checkpoint height (a height
# h with h % 1000 == 999, at least 100 blocks deep) with
# scripts/headers_head.py, and PROPOSES it as a pull request into headers-v1.
#
# It never merges, never pushes to headers-v1 or master, and never deploys.
# The blobs and their checkpoints are trust anchors for every client that
# reads the line (ONOSENDAI, cyberspace-mcp, HOSAKA), so a person reviews and
# merges each one. The only ref this job writes is a NEW branch named
# auto/headers-head-<height>.
#
# If GitHub Actions may not open pull requests in this repository (Settings >
# Actions > General > Workflow permissions), the branch is still pushed and an
# issue links the one click that opens the pull request. If anything fails,
# an issue says what. Either issue is the weekly reminder.

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write # push the new proposal branch only (see the guard below)
  pull-requests: write # open the proposal
  issues: write # the reminder or failure issue

concurrency:
  group: headers-head
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out the tool (master)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tool
          persist-credentials: false

      - name: Check out the line (headers-v1)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: headers-v1
          path: line

      - name: Is a proposal already waiting?
        id: waiting
        run: |
          pr=$(gh pr list --base headers-v1 --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("auto/headers-head-"))][0].number // empty')
          # A proposal that could only be filed as an issue (no pull request
          # permission) waits the same way.
          issue=$(gh issue list --state open --search 'in:title "headers-v1: head blob to checkpoint"' --json number,title \
            --jq '[.[] | select(.title | startswith("headers-v1: head blob to checkpoint"))][0].number // empty')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "Weekly reminder: this head-blob proposal is still open. Review and merge it (or close it) and the next run proposes the newest checkpoint height. Run: $RUN_URL"
          elif [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Weekly reminder: this head-blob proposal is still waiting. Open and merge its pull request (or close this issue) and the next run proposes the newest checkpoint height. Run: $RUN_URL"
            pr="issue-$issue"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Test the tool
        if: steps.waiting.outputs.pr == ''
        env:
          HEADERS_DIR: ${{ github.workspace }}/line
        run: python3 -I -m unittest discover -s tool/test -p 'test_*.py'

      - name: Derive, verify and cross-check
        id: derive
        if: steps.waiting.outputs.pr == ''
        run: |
          set +e
          python3 -I tool/scripts/headers_head.py --headers-dir line \
            --summary-json "$RUNNER_TEMP/summary.json" --summary-md "$RUNNER_TEMP/summary.md"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 10 ]; then echo "The head is already at the newest checkpoint height."; exit 0; fi
          [ "$code" = 0 ]
          height=$(python3 -I -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["checkpoint"]["height"]))' "$RUNNER_TEMP/summary.json")
          echo "height=$height" >> "$GITHUB_OUTPUT"
          echo "branch=auto/headers-head-$height" >> "$GITHUB_OUTPUT"

      - name: Push the proposal branch
        if: steps.derive.outputs.code == '0'
        working-directory: line
        env:
          BRANCH: ${{ steps.derive.outputs.branch }}
          HEIGHT: ${{ steps.derive.outputs.height }}
        run: |
          case "$BRANCH" in auto/headers-head-[0-9]*) ;; *) echo "refusing to push $BRANCH"; exit 1 ;; esac
          # Only the manifest and blob files may change.
          unexpected=$(git status --porcelain | awk '{print $2}' | grep -v -E '^(manifest\.json|headers-[0-9]{3}\.bin)$' || true)
          if [ -n "$unexpected" ]; then echo "unexpected changes: $unexpected"; exit 1; fi
          # A new branch only: never move a ref that already exists.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "$BRANCH already exists on the remote"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add manifest.json headers-*.bin
          git commit -q -m "headers-v1: head blob to checkpoint $HEIGHT" -m "Proposed by .github/workflows/headers-head.yml ($RUN_URL); never merged by it."
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Open the pull request, or the reminder issue
        if: steps.derive.outputs.code == '0'
        env:
          BRANCH: ${{ steps.derive.outputs.branch }}
          HEIGHT: ${{ steps.derive.outputs.height }}
        run: |
          title="headers-v1: head blob to checkpoint $HEIGHT"
          { cat "$RUNNER_TEMP/summary.md"; printf '\nRun: %s\n' "$RUN_URL"; } > "$RUNNER_TEMP/pr.md"
          if gh pr create --base headers-v1 --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr.md"; then
            exit 0
          fi
          compare="${{ github.server_url }}/${{ github.repository }}/compare/headers-v1...$BRANCH?expand=1"
          { printf 'The weekly job verified and pushed `%s` but could not open the pull request (GitHub Actions may not create pull requests in this repository: Settings > Actions > General > Workflow permissions).\n\nOpen it here: %s\n\n---\n\n' "$BRANCH" "$compare"; cat "$RUNNER_TEMP/pr.md"; } > "$RUNNER_TEMP/issue.md"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "[.[] | select(.title == \"$title: open the pull request\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$title: open the pull request" --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Report a failure as an issue
        if: failure()
        run: |
          title="Weekly headers-v1 head blob job failed"
          {
            printf 'The scheduled job published nothing. Run: %s\n\n' "$RUN_URL"
            if [ -f "$RUNNER_TEMP/summary.md" ]; then cat "$RUNNER_TEMP/summary.md"; fi
          } > "$RUNNER_TEMP/fail.md"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/fail.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/fail.md"
          fi
